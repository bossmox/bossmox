<!doctype html>
<html lang="en" data-look="daylight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BossMox: management app for Proxmox Virtual Environment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wall" aria-hidden="true">
  <svg viewBox="0 0 1440 500" preserveAspectRatio="none">
    <path fill="var(--h1)" d="M0 220 C180 130 340 150 520 215 S860 290 1060 170 1340 150 1440 200 V500 H0Z"/>
    <path fill="var(--h2)" d="M0 330 C210 250 420 290 640 335 S1040 370 1440 260 V500 H0Z"/>
    <path fill="var(--h3)" d="M0 425 C260 360 520 405 790 430 S1210 430 1440 375 V500 H0Z"/>
  </svg>
</div>

<header id="bar">
  <div id="brand">BossMox</div>
  <nav id="tasks" aria-label="Open apps"></nav>
  <span class="stale" id="stale" hidden></span>
  <div id="looks" role="group" aria-label="Look"><span>Look</span></div>
  <div id="clock"></div>
  <span class="who" id="who" hidden></span>
  <button class="signout" id="signout" hidden>Sign out</button>
</header>

<section id="login" hidden>
  <form id="loginform" aria-labelledby="logintitle">
    <h1 id="logintitle">Sign in with your Proxmox account</h1>
    <p class="sub" id="loginsub">BossMox uses your Proxmox login and permissions.</p>
    <div id="stepone">
      <label class="field"><span>Username</span><input id="luser" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="lpass" type="password" autocomplete="current-password" required></label>
      <label class="field"><span>Login type</span><select id="lrealm"></select></label>
    </div>
    <label class="field" id="steptwo" hidden><span>Code from your authenticator app</span><input id="lcode" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
    <p class="loginerr" id="loginerr" role="alert" hidden></p>
    <button class="btn primary" id="lgo" type="submit">Sign in</button>
  </form>
</section>

<main id="desk" hidden>
  <nav id="icons" aria-label="Apps"></nav>
  <section id="health" aria-live="polite"><h1>Connecting to Proxmox</h1></section>
</main>

<div id="windows"></div>
<div id="scrim"><div id="dialog" role="dialog" aria-modal="true"></div></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
