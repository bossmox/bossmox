logging {
  debug: off
  to_syslog: yes
}

nodelist {
  node {
    name: bmx8-node1
    nodeid: 1
    quorum_votes: 1
    ring0_addr: 10.0.30.244
  }
  node {
    name: bmx8-node2
    nodeid: 2
    quorum_votes: 1
    ring0_addr: 10.0.30.245
  }
  node {
    name: bmx8-node3
    nodeid: 3
    quorum_votes: 1
    ring0_addr: 10.0.30.246
  }
}

quorum {
  provider: corosync_votequorum
}

totem {
  cluster_name: bmx8lab
  config_version: 3
  interface {
    linknumber: 0
  }
  ip_version: ipv4-6
  link_mode: passive
  secauth: on
  version: 2
}

