# Dependabot proposes updates as pull requests; nothing is merged automatically. Core libraries (ws, the vendored
# console and terminal code) aren't merged until they've been tested on a real Proxmox cluster.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node's type definitions follow the oldest Node BossMox supports (22, see "engines" in package.json), so
      # code can't start relying on something newer Nodes have. Patch and minor updates within 22 still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
