name: An idea
description: Something BossMox should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like to do
      description: Describe the job you're trying to get done, in your own words, rather than the button you have in mind.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: In Proxmox's own screens, the command line, or not at all.
