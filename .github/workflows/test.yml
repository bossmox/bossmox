name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits, so a changed tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Fails when a file isn't formatted the way biome.json says (npm run format fixes it).
      - run: npx biome format
      # The deploy scripts run as root on Proxmox nodes. Notes and style hints are off: they flag the
      # `test && do || die` lines these scripts use on purpose.
      - run: shellcheck --severity=warning deploy/*.sh
      - run: npm test
